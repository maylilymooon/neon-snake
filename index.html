<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Neon Snake</title>
<style>
  :root { --bg:#0b0f1a; --panel:#141a2b; --fg:#e6edf7; --muted:#8a96ad; --snake:#3ef0a6; --food:#ff4f7b; --grid:#1a2136; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  h1 { margin:0; font-size:28px; letter-spacing:2px; color:var(--snake); text-shadow:0 0 12px var(--snake); }
  .hud { display:flex; gap:24px; font-size:16px; color:var(--muted); }
  .hud b { color:var(--fg); }
  .wrap { position:relative; width:min(92vw,480px); aspect-ratio:1; }
  canvas { width:100%; height:100%; display:block; background:var(--panel); border-radius:12px;
    box-shadow:0 0 30px rgba(62,240,166,.15); touch-action:none; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; background:rgba(11,15,26,.78); border-radius:12px; text-align:center; padding:16px; }
  .overlay.hidden { display:none; }
  .overlay h2 { margin:0; font-size:26px; }
  .overlay p { margin:0; color:var(--muted); line-height:1.6; }
  button { font:inherit; font-size:18px; padding:10px 28px; border:0; border-radius:999px; cursor:pointer;
    background:var(--snake); color:#06281b; font-weight:700; }
  button:hover { filter:brightness(1.1); }
  .pad { display:none; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(2,56px); gap:8px; }
  .pad button { padding:0; font-size:22px; background:var(--panel); color:var(--fg); border-radius:12px; }
  .pad .up { grid-column:2; } .pad .left { grid-column:1; grid-row:2; } .pad .down { grid-column:2; grid-row:2; } .pad .right { grid-column:3; grid-row:2; }
  @media (pointer:coarse) { .pad { display:grid; } }
</style>
</head>
<body>
  <h1>NEON SNAKE</h1>
  <div class="hud"><span>점수 <b id="score">0</b></span><span>최고 <b id="best">0</b></span></div>
  <div class="wrap">
    <canvas id="c" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">🐍 Neon Snake</h2>
      <p id="msg">방향키 / WASD 또는 스와이프로 이동<br>스페이스바: 일시정지</p>
      <button id="start">시작</button>
    </div>
  </div>
  <div class="pad">
    <button class="up" data-d="up">▲</button>
    <button class="left" data-d="left">◀</button>
    <button class="down" data-d="down">▼</button>
    <button class="right" data-d="right">▶</button>
  </div>
<script>
const N = 20, canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const S = canvas.width / N;
const $ = id => document.getElementById(id);
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
let snake, dir, queue, food, score, best = 0, speed, timer = null, state = 'menu';
try { best = +localStorage.getItem('neon-snake-best') || 0; } catch (e) {}
$('best').textContent = best;

function reset() {
  snake = [[10,10],[9,10],[8,10]];
  dir = DIRS.right; queue = [];
  score = 0; speed = 130;
  $('score').textContent = 0;
  placeFood();
}
function placeFood() {
  do { food = [Math.floor(Math.random()*N), Math.floor(Math.random()*N)]; }
  while (snake.some(([x,y]) => x === food[0] && y === food[1]));
}
function start() {
  reset(); state = 'play';
  $('overlay').classList.add('hidden');
  loop();
}
function loop() {
  clearTimeout(timer);
  if (state !== 'play') return;
  step(); draw();
  timer = setTimeout(loop, speed);
}
function step() {
  if (queue.length) dir = queue.shift();
  const head = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
  const hitWall = head[0] < 0 || head[1] < 0 || head[0] >= N || head[1] >= N;
  const hitSelf = snake.slice(0, -1).some(([x,y]) => x === head[0] && y === head[1]);
  if (hitWall || hitSelf) return gameOver();
  snake.unshift(head);
  if (head[0] === food[0] && head[1] === food[1]) {
    score += 10; $('score').textContent = score;
    speed = Math.max(55, speed - 3);
    placeFood();
  } else snake.pop();
}
function gameOver() {
  state = 'over';
  if (score > best) { best = score; try { localStorage.setItem('neon-snake-best', best); } catch (e) {} }
  $('best').textContent = best;
  $('title').textContent = '게임 오버';
  $('msg').innerHTML = `점수: <b>${score}</b>`;
  $('start').textContent = '다시 하기';
  $('overlay').classList.remove('hidden');
}
function togglePause() {
  if (state === 'play') {
    state = 'pause'; clearTimeout(timer);
    $('title').textContent = '일시정지'; $('msg').textContent = '스페이스바로 계속';
    $('start').textContent = '계속'; $('overlay').classList.remove('hidden');
  } else if (state === 'pause') {
    state = 'play'; $('overlay').classList.add('hidden'); loop();
  }
}
function turn(name) {
  const d = DIRS[name], last = queue.length ? queue[queue.length-1] : dir;
  if (d[0] === -last[0] && d[1] === -last[1]) return;
  if (d === last) return;
  if (queue.length < 3) queue.push(d);
}
function draw() {
  ctx.fillStyle = '#141a2b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#1a2136'; ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i*S, 0); ctx.lineTo(i*S, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*S); ctx.lineTo(canvas.width, i*S); ctx.stroke();
  }
  ctx.shadowBlur = 16; ctx.shadowColor = '#ff4f7b'; ctx.fillStyle = '#ff4f7b';
  ctx.beginPath(); ctx.arc(food[0]*S + S/2, food[1]*S + S/2, S/2.6, 0, Math.PI*2); ctx.fill();
  ctx.shadowColor = '#3ef0a6';
  snake.forEach(([x,y], i) => {
    ctx.fillStyle = i === 0 ? '#b6ffe0' : `hsl(155, 85%, ${60 - Math.min(i, 25)}%)`;
    ctx.beginPath(); ctx.roundRect(x*S + 2, y*S + 2, S - 4, S - 4, 5); ctx.fill();
  });
  ctx.shadowBlur = 0;
}

document.addEventListener('keydown', e => {
  const k = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right' }[e.key];
  if (k) { e.preventDefault(); if (state === 'play') turn(k); }
  else if (e.key === ' ') { e.preventDefault(); if (state === 'menu' || state === 'over') start(); else togglePause(); }
});
$('start').onclick = () => state === 'pause' ? togglePause() : start();
document.querySelectorAll('.pad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') turn(b.dataset.d); }));
let t0 = null;
canvas.addEventListener('touchstart', e => { t0 = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive:true });
canvas.addEventListener('touchend', e => {
  if (!t0 || state !== 'play') return;
  const dx = e.changedTouches[0].clientX - t0[0], dy = e.changedTouches[0].clientY - t0[1];
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  t0 = null;
});
reset(); draw();
</script>
</body>
</html>
